<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Cloud Player</title>
    <link rel="icon" type="image/png" href="images/mysongs.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg-color: #121212;
            --sidebar-bg: #000000;
            --card-bg: #181818;
            --card-hover: #282828;
            --accent-color: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 90px);
            overflow: hidden;
        }

        /* Boční panel */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-right: 1px solid #222;
        }

        .sidebar h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            margin: 0 0 10px 10px;
        }

        .artist-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .artist-btn:hover, .artist-btn.active {
            color: var(--text-main);
            background-color: var(--card-hover);
        }

        .artist-btn.active {
            color: var(--accent-color);
        }

        /* Hlavní výpis skladeb */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: linear-gradient(180deg, #202020 0%, var(--bg-color) 350px);
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 30px;
        }

        .artist-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            background-color: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--text-sub);
        }

        .header-title {
            font-size: 42px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: transparent;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .song-item:hover {
            background-color: var(--card-hover);
        }

        .song-info-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .song-index {
            color: var(--text-sub);
            font-size: 14px;
            width: 20px;
            text-align: center;
        }

        .song-name {
            font-size: 15px;
            font-weight: 500;
        }

        .song-item.playing .song-name {
            color: var(--accent-color);
            font-weight: 700;
        }

        .song-item.playing .song-index {
            color: var(--accent-color);
        }

        /* Vlastní spodní přehrávač */
        .player-bar {
            height: 90px;
            background-color: var(--sidebar-bg);
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .now-playing-box {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 30%;
        }

        .now-playing-cover {
            width: 54px;
            height: 54px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-sub);
        }

        .now-playing-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .np-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-artist {
            font-size: 12px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
            max-width: 600px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: var(--text-main);
        }

        .play-pause-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--text-main);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: transform 0.1s;
        }

        .play-pause-btn:hover {
            transform: scale(1.05);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            font-size: 11px;
            color: var(--text-sub);
        }

        .progress-bar-bg {
            flex: 1;
            height: 6px;
            background-color: #4d4d4d;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--text-main);
            width: 0%;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        .progress-bar-bg:hover .progress-bar-fill {
            background-color: var(--accent-color);
        }

        .player-right {
            width: 30%;
            display: flex;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                height: calc(100vh - 100px);
            }
            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                overflow-x: auto;
                padding: 10px;
            }
            .sidebar h2 { display: none; }
            .artist-btn { white-space: nowrap; padding: 8px 14px; background: #222; border-radius: 20px; }
            .main-content { padding: 15px; }
            .header-section { gap: 15px; margin-bottom: 20px; }
            .artist-avatar { width: 70px; height: 70px; font-size: 24px; }
            .header-title { font-size: 24px; }
            .player-bar { padding: 0 10px; height: 100px; }
            .now-playing-box { width: 45%; }
            .player-center { width: 50%; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Boční menu -->
        <div class="sidebar">
            <h2>Interpreti</h2>
            <div id="artist-list"></div>
        </div>

        <!-- Hlavní obsah -->
        <div class="main-content">
            <div class="header-section">
                <div id="artist-avatar-container" class="artist-avatar">🎵</div>
                <h1 class="header-title" id="current-artist-title">Vyberte interpreta</h1>
            </div>
            <div class="song-list" id="song-list"></div>
        </div>
    </div>

    <!-- Spodní přehrávač -->
    <div class="player-bar">
        <div class="now-playing-box">
            <div id="np-cover-container" class="now-playing-cover">🎵</div>
            <div class="now-playing-meta">
                <div class="np-title" id="now-playing-title">Nic se nepřehrává</div>
                <div class="np-artist" id="now-playing-artist">-</div>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="control-btn" onclick="prevSong()" title="Předchozí">⏮</button>
                <button class="play-pause-btn" id="play-pause-icon" onclick="togglePlay()">▶</button>
                <button class="control-btn" onclick="nextSong()" title="Další">⏭</button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar-bg" id="progress-bar" onclick="seekSong(event)">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <div class="player-right"></div>
    </div>

    <!-- Skrytý audio element -->
    <audio id="audio-player"></audio>

    <script>
        let musicData = {};
        let currentArtist = "";
        let currentSongIndex = -1;

        const audioPlayer = document.getElementById('audio-player');
        const nowPlayingTitle = document.getElementById('now-playing-title');
        const nowPlayingArtist = document.getElementById('now-playing-artist');
        const artistListEl = document.getElementById('artist-list');
        const songListEl = document.getElementById('song-list');
        const currentArtistTitle = document.getElementById('current-artist-title');
        const playPauseBtn = document.getElementById('play-pause-icon');
        const progressFill = document.getElementById('progress-fill');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const artistAvatarContainer = document.getElementById('artist-avatar-container');
        const npCoverContainer = document.getElementById('np-cover-container');

        fetch('songs.json')
            .then(response => response.json())
            .then(data => {
                musicData = data;
                renderArtists();
            })
            .catch(err => console.error('Chyba načítání songs.json:', err));

        function renderArtists() {
            artistListEl.innerHTML = '';
            const artists = Object.keys(musicData);
            
            artists.forEach((artist, index) => {
                const btn = document.createElement('button');
                btn.className = 'artist-btn';
                btn.innerHTML = `🎵 ${artist}`;
                btn.onclick = () => selectArtist(artist, btn);
                artistListEl.appendChild(btn);

                if (index === 0) selectArtist(artist, btn);
            });
        }

        function selectArtist(artist, btnElement) {
            currentArtist = artist;
            currentArtistTitle.textContent = artist;
            
            const coverPath = `songs/${artist}/cover.jpg`;
            artistAvatarContainer.innerHTML = `<img src="${coverPath}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" onerror="this.onerror=null;this.parentElement.innerHTML='🎵';">`;

            document.querySelectorAll('.artist-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            renderSongs();
        }

        function renderSongs() {
            songListEl.innerHTML = '';
            const songs = musicData[currentArtist] || [];

            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'song-item';
                const cleanName = song.replace(/\.[^/.]+$/, "");
                
                item.innerHTML = `
                    <div class="song-info-left">
                        <span class="song-index">${index + 1}</span>
                        <div class="song-name">${cleanName}</div>
                    </div>
                `;

                item.onclick = () => playSong(index);
                songListEl.appendChild(item);
            });
        }

        function playSong(index) {
            const songs = musicData[currentArtist];
            if (!songs || !songs[index]) return;

            currentSongIndex = index;
            const songFile = songs[index];
            const songPath = `songs/${currentArtist}/${songFile}`;

            audioPlayer.src = songPath;
            audioPlayer.play().catch(e => console.log("Přehrávání zablokováno:", e));
            playPauseBtn.textContent = "⏸";

            const cleanName = songFile.replace(/\.[^/.]+$/, "");
            nowPlayingTitle.textContent = cleanName;
            nowPlayingArtist.textContent = currentArtist;

            const coverPath = `songs/${currentArtist}/cover.jpg`;
            npCoverContainer.innerHTML = `<img src="${coverPath}" style="width:100%;height:100%;border-radius:4px;object-fit:cover;" onerror="this.onerror=null;this.parentElement.innerHTML='🎵';">`;

            const items = songListEl.querySelectorAll('.song-item');
            items.forEach((it, i) => {
                if (i === index) {
                    it.classList.add('playing');
                } else {
                    it.classList.remove('playing');
                }
            });
        }

        function togglePlay() {
            if (currentSongIndex === -1 && musicData[currentArtist]?.length > 0) {
                playSong(0);
                return;
            }
            if (audioPlayer.paused) {
                audioPlayer.play();
                playPauseBtn.textContent = "⏸";
            } else {
                audioPlayer.pause();
                playPauseBtn.textContent = "▶";
            }
        }

        function nextSong() {
            const songs = musicData[currentArtist];
            if (!songs) return;
            let nextIndex = currentSongIndex + 1;
            if (nextIndex >= songs.length) nextIndex = 0;
            playSong(nextIndex);
        }

        function prevSong() {
            const songs = musicData[currentArtist];
            if (!songs) return;
            let prevIndex = currentSongIndex - 1;
            if (prevIndex < 0) prevIndex = songs.length - 1;
            playSong(prevIndex);
        }

        audioPlayer.ontimeupdate = () => {
            if (audioPlayer.duration) {
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressFill.style.width = `${progressPercent}%`;
                
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                totalDurationEl.textContent = formatTime(audioPlayer.duration);
            }
        };

        function seekSong(event) {
            const rect = progressBar.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const width = rect.width;
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (clickX / width) * audioPlayer.duration;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        audioPlayer.onended = () => {
            nextSong();
        };
    </script>
</body>
</html>
