<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Cloud Player</title>
    <link rel="icon" type="image/png" href="images/mysongs.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Boční menu -->
        <div class="sidebar">
            <div class="brand-logo" onclick="showHome()">🎵 CloudPlayer</div>
            
            <button class="nav-item active" id="nav-home" onclick="showHome()">
                🏠 Domů
            </button>
            <button class="nav-item" id="nav-favorites" onclick="showFavorites()">
                ❤️ Oblíbené
            </button>

            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="search-input" placeholder="Hledat..." oninput="handleSearch()">
            </div>

            <h2>Interpreti</h2>
            <div id="artist-list"></div>
        </div>

        <!-- Hlavní obsah -->
        <div class="main-content" id="main-content"></div>
    </div>

    <!-- Spodní lišta přehrávače -->
    <div class="player-bar">
        <div class="now-playing-box" onclick="openFullscreenPlayer()">
            <div id="np-cover-container" class="now-playing-cover">🎵</div>
            <div class="now-playing-meta">
                <div class="np-title" id="now-playing-title">Nic se nepřehrává</div>
                <div class="np-artist" id="now-playing-artist">Vyberte skladbu</div>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="control-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Náhodně">🔀</button>
                <button class="control-btn" onclick="prevSong()" title="Předchozí">⏮</button>
                <button class="play-pause-btn" id="play-pause-icon" onclick="togglePlay()">▶</button>
                <button class="control-btn" onclick="nextSong()" title="Další">⏭</button>
                <button class="control-btn" id="repeat-btn" onclick="toggleRepeat()" title="Opakovat">🔁</button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar-bg" id="progress-bar" onclick="seekSong(event)">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <!-- Tlačítko lajku v přehrávači -->
            <button class="control-btn" id="fav-toggle-btn" onclick="toggleCurrentFavorite()" style="font-size: 20px;" title="Oblíbené">🤍</button>
        </div>
    </div>

    <!-- Fullscreen Player pro mobily -->
    <div class="mobile-fullscreen-player" id="fs-player">
        <button class="close-fs-btn" onclick="closeFullscreenPlayer()">✕</button>
        <div class="fs-cover" id="fs-cover">🎵</div>
        <div class="fs-meta-row">
            <div class="fs-meta">
                <div class="fs-title" id="fs-title">Nic se nepřehrává</div>
                <div class="fs-artist" id="fs-artist">-</div>
            </div>
            <button class="control-btn" id="fs-fav-toggle-btn" onclick="toggleCurrentFavorite()" style="font-size: 26px;">🤍</button>
        </div>
        <div class="progress-container">
            <span id="fs-current-time">0:00</span>
            <div class="progress-bar-bg" id="fs-progress-bar" onclick="seekSong(event)">
                <div class="progress-bar-fill" id="fs-progress-fill"></div>
            </div>
            <span id="fs-total-duration">0:00</span>
        </div>
        <div class="fs-controls">
            <button class="control-btn" id="fs-shuffle-btn" onclick="toggleShuffle()" style="font-size: 22px;">🔀</button>
            <button class="control-btn" style="font-size: 28px;" onclick="prevSong()">⏮</button>
            <button class="fs-play-btn" id="fs-play-btn" onclick="togglePlay()">▶</button>
            <button class="control-btn" style="font-size: 28px;" onclick="nextSong()">⏭</button>
            <button class="control-btn" id="fs-repeat-btn" onclick="toggleRepeat()" style="font-size: 22px;">🔁</button>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script src="script.js"></script>
</body>
</html>
